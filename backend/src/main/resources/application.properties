# Server Port - Render dynamically sets the PORT environment variable
server.port=${PORT:8080}

# PostgreSQL Database Configuration for Render & Production
# You can supply these environment variables in your Render Dashboard:
# SPRING_DATASOURCE_URL (e.g. jdbc:postgresql://dpg-xxx.oregon-postgres.render.com:5432/dbname)
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_task_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
